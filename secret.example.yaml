# ------------------------------------------------------------------------------
# TEMPLATE — copie para secret.local.yaml (em .gitignore) e preencha.
#
#   cp secret.example.yaml secret.local.yaml
#   # gere a senha:
#   openssl rand -base64 24        # -> MARIADB_ROOT_PASSWORD
#   kubeseal --format yaml --controller-namespace kube-system \
#     < secret.local.yaml > sealed-secret.yaml
#   # commite apenas sealed-secret.yaml
#
# Trocar MARIADB_ROOT_PASSWORD depois do 1º boot NÃO altera a senha no datadir
# já inicializado (a var só é lida na criação do volume). Para trocar de fato:
#   ALTER USER 'root'@'%' IDENTIFIED BY '...'; FLUSH PRIVILEGES;
#
# Valor atualmente publicado (base64):  cm9vdHBhc3M=  ->  "rootpass"
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
  namespace: mariadb
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: "REPLACE_com_openssl_rand_base64_24"
