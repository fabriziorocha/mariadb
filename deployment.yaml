apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  labels:
    app: mariadb
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Banco de dados em PVC RWO: com RollingUpdate o kustomize/Deployment pode
  # subir um 2º pod antes de matar o 1º, e os dois abrem o mesmo datadir ->
  # corrupção. `Recreate` garante um pod por vez. (No cluster hoje está a
  # strategy padrão RollingUpdate — este é o principal ajuste vs. o publicado.)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mariadb
          image: mariadb:11.8
          args:
            # buffer pool 256M + ~overhead do mysqld => steady ~330Mi observado.
            # O limite de 1Gi é folga para picos de conexões/temp tables/mysqldump.
            - "--innodb-buffer-pool-size=256M"
          envFrom:
            - configMapRef:
                name: mariadb-config
            - secretRef:
                name: mariadb-secret
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: mariadb-storage
              mountPath: /var/lib/mysql
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            initialDelaySeconds: 10
            periodSeconds: 10
          # Uso observado (Prometheus/lens-metrics, 2d): pico ~330Mi / ~41m —
          # 330/512Mi = 64% do limit antigo, pouca folga p/ pico de conexões.
          # Sem limit de CPU: um mysqldump/bulk-op não deve ser estrangulado.
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              memory: "1Gi"
      volumes:
        - name: mariadb-storage
          persistentVolumeClaim:
            claimName: mariadb-data
